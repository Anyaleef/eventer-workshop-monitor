name: Check Eventer workshops

on:
  workflow_dispatch:
  schedule:
    - cron: '2/5 * * * *'
      timezone: 'Asia/Jerusalem'

permissions:
  contents: write # Save the last known availability, avoiding repeat alerts.

concurrency:
  group: eventer-monitor-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Check monitoring window
        id: window
        run: |
          python3 - <<'PY'
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          import os
          active = datetime.now(ZoneInfo("Asia/Jerusalem")).date() < date(2026, 10, 13)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"active={str(active).lower()}\n")
          if not active:
              print("Monitoring period finished; skipping page checks and notifications")
          PY
      - uses: actions/setup-python@v6
        if: steps.window.outputs.active == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.window.outputs.active == 'true'
      - run: python -m playwright install --with-deps chromium
        if: steps.window.outputs.active == 'true'
      - name: Check availability
        if: steps.window.outputs.active == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python monitor.py --manual
          else
            python monitor.py
          fi
      - name: Save latest statuses
        if: always() && steps.window.outputs.active == 'true' && github.event_name == 'schedule'
        run: |
          if git status --porcelain -- monitor_state.json | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add monitor_state.json
            git commit -m 'Update workshop availability state'
            git push
          fi
