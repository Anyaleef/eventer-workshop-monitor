name: Check Eventer workshops

on:
  workflow_dispatch:
    inputs:
      check_only:
        description: "Check both pages without sending Telegram messages"
        required: true
        type: boolean
        default: true
  # After making this repository public and configuring Telegram secrets,
  # enable the following schedule. Scheduled runs automatically send alerts.
  # schedule:
  #   - cron: '2/5 * * * *'

permissions:
  contents: write # Save the last known availability, avoiding repeat alerts.

concurrency:
  group: eventer-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check availability
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.check_only }}" == "true" ]]; then
            python monitor.py --check-only
          else
            python monitor.py
          fi
      - name: Save latest statuses
        if: always() && !(github.event_name == 'workflow_dispatch' && inputs.check_only)
        run: |
          if git status --porcelain -- monitor_state.json | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add monitor_state.json
            git commit -m 'Update workshop availability state'
            git push
          fi
