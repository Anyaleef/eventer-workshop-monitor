name: Check Eventer workshops

on:
  workflow_dispatch:
  schedule:
    - cron: '2/5 * * * *'
      timezone: 'Asia/Jerusalem'

permissions:
  contents: write # Save the last known availability, avoiding repeat alerts.

concurrency:
  group: eventer-monitor-${{ github.event_name }}
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: true
      - name: Send cohort end notices
        if: github.event_name == 'schedule'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 monitor.py --end-notices
      - name: Check monitoring window
        id: window
        run: |
          python3 - <<'PY'
          from datetime import date, datetime
          from zoneinfo import ZoneInfo
          import os
          today = datetime.now(ZoneInfo("Asia/Jerusalem")).date()
          cohorts_active = today < date(2026, 10, 13)
          listing_active = today < date(2026, 10, 23)
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"cohorts_active={str(cohorts_active).lower()}\n")
              output.write(f"listing_active={str(listing_active).lower()}\n")
          if not listing_active:
              print("AI Days finished; skipping page checks")
          PY
      - uses: actions/setup-python@v6
        if: steps.window.outputs.listing_active == 'true'
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
        if: steps.window.outputs.listing_active == 'true'
      - id: browser
        run: python -m playwright install --with-deps chromium
        if: steps.window.outputs.listing_active == 'true'
      - name: Check availability
        if: steps.window.outputs.cohorts_active == 'true'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            python monitor.py --manual
          else
            python monitor.py
          fi
      - name: Check AI Days registration links
        if: always() && github.event_name == 'schedule' && steps.window.outputs.listing_active == 'true' && steps.browser.outcome == 'success'
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python ai_days_monitor.py
      - name: Save latest statuses
        if: always() && github.event_name == 'schedule'
        run: |
          if git status --porcelain -- monitor_state.json | grep -q .; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add monitor_state.json
            git commit -m 'Update workshop availability state'
            git push
          fi
