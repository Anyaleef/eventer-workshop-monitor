name: Schedule probe (hourly)

on:
  schedule:
    - cron: '13 * * * *'
      timezone: 'Asia/Jerusalem'

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Record the automatic trigger
        run: |
          echo "event=${{ github.event_name }}"
          date -u '+utc=%Y-%m-%dT%H:%M:%SZ'
